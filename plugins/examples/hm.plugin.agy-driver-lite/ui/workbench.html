<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AGY Lite Workbench</title>
    <style>
      body {
        margin: 0;
        padding: 16px;
        font-family: system-ui, -apple-system, sans-serif;
        background: #0f172a;
        color: #e2e8f0;
      }
      .card {
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 10px;
        padding: 14px;
        margin-bottom: 12px;
      }
      .row {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      button {
        background: #2563eb;
        color: #fff;
        border: none;
        border-radius: 6px;
        padding: 6px 12px;
        cursor: pointer;
      }
      button.danger {
        background: #dc2626;
      }
      pre {
        background: #020617;
        padding: 10px;
        border-radius: 6px;
        overflow: auto;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h3>AGY Lite Workbench (Pure-SDK Peer)</h3>
      <div id="identity">Loading provider identity...</div>
    </div>
    <div class="card">
      <div class="row">
        <button id="btn-refresh">Refresh Snapshot</button>
        <button id="btn-swarm">Launch Lite Swarm</button>
        <button id="btn-cancel" class="danger">Cancel Active</button>
      </div>
    </div>
    <div class="card">
      <h4>Projection</h4>
      <pre id="projection">{}</pre>
    </div>
    <script src="./workbench.js"></script>
  </body>
</html>
