<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>DeepSeek 推理预算</title>
  <style>
    :root {
      --ds-accent: #4D6BFE;
      --ds-soft: rgba(77, 107, 254, 0.14);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: transparent;
      color: var(--text-primary, #1e293b);
      font-size: 12px;
      line-height: 1.45;
    }
    .card {
      background: var(--bg-surface, rgba(148, 163, 184, 0.08));
      border: 1px solid var(--border-hairline, rgba(148, 163, 184, 0.25));
      border-radius: 12px;
      padding: 10px 12px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }
    .title {
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--ds-accent);
      display: inline-block;
    }
    .badge {
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 999px;
      background: var(--ds-soft);
      color: var(--ds-accent);
      font-weight: 600;
      text-transform: uppercase;
    }
    .bar-track {
      width: 100%;
      height: 7px;
      border-radius: 999px;
      background: var(--border-hairline, rgba(148, 163, 184, 0.24));
      overflow: hidden;
      margin-bottom: 6px;
    }
    .bar-fill {
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #4D6BFE, #7B92FF);
      width: 0%;
      transition: width 0.25s ease;
    }
    .meta {
      display: flex;
      justify-content: space-between;
      color: var(--text-muted, #64748b);
      font-size: 11px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="title">
        <span class="dot"></span>
        <span id="titleText">DeepSeek 推理预算</span>
      </div>
      <span id="budgetBadge" class="badge">MEDIUM</span>
    </div>
    <div class="bar-track">
      <div id="barFill" class="bar-fill"></div>
    </div>
    <div class="meta">
      <span id="tokensText">0 / 16384 tokens</span>
      <span id="ratioText">0%</span>
    </div>
  </div>
  <script>
    (function () {
      function render(props) {
        var block = (props && props.block) || {};
        var payload = block.payload || {};
        var titleEl = document.getElementById('titleText');
        var badgeEl = document.getElementById('budgetBadge');
        var fillEl = document.getElementById('barFill');
        var tokensEl = document.getElementById('tokensText');
        var ratioEl = document.getElementById('ratioText');

        titleEl.textContent = block.title || 'DeepSeek 推理预算';
        var budget = String(payload.reasoningBudget || 'medium').toUpperCase();
        var deepThink = payload.deepThink !== false;
        badgeEl.textContent = budget + (deepThink ? ' · DEEP THINK' : '');

        var used = Number(payload.reasoningTokens || 0);
        var limit = Math.max(1, Number(payload.budgetLimitTokens || 16384));
        var ratio = Math.min(100, Math.max(0, Number(payload.ratioPercent != null ? payload.ratioPercent : Math.round((used / limit) * 100))));

        fillEl.style.width = ratio + '%';
        tokensEl.textContent = used + ' / ' + limit + ' 思考 tokens (输出 ' + Number(payload.outputTokens || 0) + ')';
        ratioEl.textContent = ratio + '%';
        if (window.harnessMate && typeof window.harnessMate.resize === 'function') {
          window.harnessMate.resize(96);
        }
      }

      if (window.harnessMate) {
        render(window.harnessMate.props);
        window.harnessMate.onContext(function (_session, nextProps) {
          render(nextProps);
        });
      }
    })();
  </script>
</body>
</html>
